name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION: EmberTrace.slnx
  CONFIGURATION: Release
  COVERAGE_MIN_LINE: '65'
  COVERAGE_MIN_BRANCH: '55'

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        shell: bash
        run: |
          dotnet build "$SOLUTION" -c "$CONFIGURATION" --no-restore -warnaserror \
            -p:UseLocalEmberTrace=true \
            -p:ContinuousIntegrationBuild=true \
            -bl:artifacts/binlog/build-${{ matrix.label }}.binlog

      - name: Format
        if: runner.os == 'Linux'
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Test
        id: test
        shell: bash
        run: |
          args=(
            --no-build -c "$CONFIGURATION"
            --logger trx
            --results-directory artifacts/test
            --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
          )
          if [ "$RUNNER_OS" = Linux ]; then
            args+=(--settings build/coverage.runsettings --collect "Code Coverage")
          fi
          dotnet test "$SOLUTION" "${args[@]}" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Test summary
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 .github/scripts/trx_summary.py \
            --title "Tests (${{ matrix.label }})" --fail-on-error artifacts/test

      - name: Coverage gate
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/coverage_gate.py \
            --min-line "$COVERAGE_MIN_LINE" --min-branch "$COVERAGE_MIN_BRANCH" \
            artifacts/test/*/*.cobertura.xml

      - name: Pack
        if: runner.os == 'Linux'
        run: |
          dotnet pack "$SOLUTION" -c "$CONFIGURATION" --no-build \
            -p:UseLocalEmberTrace=true \
            -p:ContinuousIntegrationBuild=true \
            -o artifacts/packages
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' build/Directory.Build.props | head -n1)
          python3 .github/scripts/nupkg_check.py --version "$version" artifacts/packages

      - name: Run samples
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for sample in EmberTrace.BasicTracing EmberTrace.ParallelWorkers EmberTrace.AutoInstrumentation EmberTrace.DocScreenshots; do
            echo "::group::$sample"
            dotnet run --project "samples/$sample/$sample.csproj" -c "$CONFIGURATION" --no-build
            echo "::endgroup::"
          done

      - if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.label }}
          path: artifacts/test
          retention-days: 14
          if-no-files-found: warn

      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}
          if-no-files-found: error

      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: doc-assets
          path: samples/EmberTrace.DocScreenshots/out
          retention-days: 7
          if-no-files-found: warn

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: binlog-${{ matrix.label }}
          path: artifacts/binlog
          retention-days: 7
          if-no-files-found: ignore

  native-aot:
    name: Native AOT (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            binary: EmberTrace.NativeAot
          - os: windows-latest
            label: windows
            binary: EmberTrace.NativeAot.exe
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          restore: 'false'

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish
        shell: bash
        run: |
          dotnet publish samples/EmberTrace.NativeAot/EmberTrace.NativeAot.csproj \
            -c "$CONFIGURATION" -warnaserror \
            -p:PublishAot=true \
            -p:UseLocalEmberTrace=true \
            -p:TrimmerSingleWarn=false \
            -o artifacts/aot

      - name: Run
        shell: bash
        run: ./artifacts/aot/${{ matrix.binary }}

  perf:
    name: Perf
    uses: ./.github/workflows/benchmarks.yml
    with:
      job: ${{ github.event_name == 'pull_request' && 'short' || 'default' }}

  ci:
    name: CI
    if: always()
    needs: [build, native-aot, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          bad = {n: d["result"] for n, d in needs.items() if d["result"] not in ("success", "skipped")}

          rows = ["## " + ("CI failed" if bad else "CI passed"), "", "| Job | Result |", "|---|---|"]
          rows += [f"| `{n}` | {d['result']} |" for n, d in sorted(needs.items())]
          report = "\n".join(rows) + "\n"

          print(report)
          if path := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(report)

          for name, result in bad.items():
              print(f"::error title=CI::{name} -> {result}")
          sys.exit(1 if bad else 0)
          PY
